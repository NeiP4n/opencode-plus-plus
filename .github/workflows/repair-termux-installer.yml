name: repair-termux-installer

on:
  push:
    branches: [lan-rooms]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lan-rooms

      - name: Restore installer from known-good commit and patch SIGSYS chaining
        env:
          GIT_SHA: c01cdcc0414feeed0aed3da6d00bab897df7a18f
        run: |
          git checkout "$GIT_SHA" -- opencode-pp-install.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('opencode-pp-install.sh')
          s = p.read_text()
          old = r'''static void sigsys_handler(int signo, siginfo_t *info, void *context) {
  (void)signo;
  if (!info || info->si_code != SYS_SECCOMP || !context) _exit(128 + SIGSYS);
#if defined(__aarch64__)
  ucontext_t *uc = (ucontext_t *)context;
  uc->uc_mcontext.pc += 4;
  uc->uc_mcontext.regs[0] = (unsigned long)(long)-ENOSYS;
#else
  _exit(128 + SIGSYS);
#endif
}

__attribute__((constructor))
static void install_sigsys_handler(void) {
  struct sigaction sa = {0};
  sa.sa_sigaction = sigsys_handler;
  sa.sa_flags = SA_SIGINFO | SA_ONSTACK;
  sigemptyset(&sa.sa_mask);
  (void)sigaction(SIGSYS, &sa, NULL);
}'''
          new = old + r'''

/* Bun may install its own SIGSYS disposition after our constructor. Android
 * seccomp needs our handler to remain armed, so interpose sigaction/signal
 * for SIGSYS while forwarding every other signal unchanged. */
static int (*real_sigaction_ptr)(int, const struct sigaction *, struct sigaction *);
static void *(*real_signal_ptr)(int, void (*)(int));
static struct sigaction chained_sigsys_action;
static int chained_sigsys_valid;

static void resolve_signal_apis(void) {
  if (!real_sigaction_ptr)
    real_sigaction_ptr = (int (*)(int, const struct sigaction *, struct sigaction *))dlsym(RTLD_NEXT, "sigaction");
  if (!real_signal_ptr)
    real_signal_ptr = (void *(*)(int, void (*)(int)))dlsym(RTLD_NEXT, "signal");
}

int sigaction(int signum, const struct sigaction *act, struct sigaction *oldact) {
  resolve_signal_apis();
  if (signum != SIGSYS || !real_sigaction_ptr)
    return real_sigaction_ptr ? real_sigaction_ptr(signum, act, oldact) : -1;

  if (oldact) {
    if (chained_sigsys_valid) *oldact = chained_sigsys_action;
    else {
      oldact->sa_handler = SIG_DFL;
      sigemptyset(&oldact->sa_mask);
      oldact->sa_flags = 0;
    }
  }
  if (act) {
    chained_sigsys_action = *act;
    chained_sigsys_valid = 1;
  }

  struct sigaction ours = {0};
  ours.sa_sigaction = sigsys_handler;
  ours.sa_flags = SA_SIGINFO | SA_ONSTACK;
  sigemptyset(&ours.sa_mask);
  return real_sigaction_ptr(SIGSYS, &ours, NULL);
}

void *signal(int signum, void (*handler)(int)) {
  resolve_signal_apis();
  if (signum != SIGSYS || !real_signal_ptr)
    return real_signal_ptr ? real_signal_ptr(signum, handler) : SIG_ERR;

  struct sigaction ours = {0};
  ours.sa_sigaction = sigsys_handler;
  ours.sa_flags = SA_SIGINFO | SA_ONSTACK;
  sigemptyset(&ours.sa_mask);
  if (real_sigaction_ptr) real_sigaction_ptr(SIGSYS, &ours, NULL);
  return (void *)SIG_DFL;
}'''
          if old not in s:
              raise SystemExit('expected SIGSYS handler block not found')
          s = s.replace(old, new, 1)
          # Keep the installer from accepting a shim that merely turns pidfd_open
          # into Bun's "Unknown Error, errno 0". The full spawn probe is retained;
          # this patch specifically keeps the SIGSYS handler armed after Bun setup.
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add opencode-pp-install.sh
          git commit -m 'fix(termux): keep SIGSYS compatibility handler armed' || exit 0
          git push origin HEAD:lan-rooms
